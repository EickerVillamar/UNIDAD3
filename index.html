// Diagramas vectoriales incluidos en el HTML: funcionan sin bibliotecas externas.
function flowchart(example){
  const prefix='flow-'+example.id;
  const nodes=example.nodes.map(([id,type,cx,y,w,h,lines])=>{
    const x=cx-w/2,cy=y+h/2;
    let shape;
    if(type==='decision')shape=`<polygon points="${cx},${y} ${x+w},${cy} ${cx},${y+h} ${x},${cy}"/>`;
    else if(type==='io')shape=`<polygon points="${x+18},${y} ${x+w},${y} ${x+w-18},${y+h} ${x},${y+h}"/>`;
    else shape=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${type==='terminal'?h/2:5}"/>`;
    const text=lines.map((line,i)=>`<tspan x="${cx}" y="${cy-(lines.length-1)*13+i*26+6}">${escapeHTML(line)}</tspan>`).join('');
    return `<g class="flow-node flow-${type}">${shape}<text text-anchor="middle">${text}</text></g>`;
  }).join('');
  const edges=example.edges.map(([d,label,x,y])=>`<path class="flow-arrow" d="${d}" marker-end="url(#${prefix}-arrow)"/>${label?`<text class="flow-label" x="${x}" y="${y}" text-anchor="middle">${escapeHTML(label)}</text>`:''}`).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 ${example.height+15}" role="img" aria-labelledby="${prefix}-title ${prefix}-desc"><title id="${prefix}-title">Flujograma: ${escapeHTML(example.title)}</title><desc id="${prefix}-desc">${escapeHTML(example.description)} Las flechas indican el orden. Las decisiones tienen caminos Sí y No. El pseudocódigo contiguo describe las mismas instrucciones.</desc><defs><marker id="${prefix}-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b8fa69"/></marker></defs>${edges}${nodes}</svg>`;
}

function renderAlgorithmLesson(){
  el('sectionHeading').innerHTML='<h2 class="section-title">Pseudocódigo y flujogramas</h2><p class="welcome">Dos maneras de representar el mismo algoritmo: una con instrucciones y otra con símbolos conectados.</p>';
  const intro=`<article class="lesson-intro">
    <div class="lesson-concepts"><div><h3>¿Qué es el pseudocódigo?</h3><p>Es una descripción ordenada de los pasos para resolver un problema. Usa palabras fáciles de leer; aquí seguimos el estilo de PSeInt.</p></div><div><h3>¿Qué es un flujograma?</h3><p>Es la representación gráfica de esos mismos pasos. Sigue las flechas desde el inicio hasta el fin y observa dónde se decide o se repite.</p></div></div>
    <h3>Reconoce los símbolos</h3>
    <ul class="symbol-key"><li><span class="symbol-demo symbol-terminal" aria-hidden="true"></span><strong>Óvalo</strong><span>Inicio y fin.</span></li><li><span class="symbol-demo symbol-process" aria-hidden="true"></span><strong>Rectángulo</strong><span>Proceso: definir, calcular o asignar.</span></li><li><span class="symbol-demo symbol-io" aria-hidden="true"></span><strong>Paralelogramo</strong><span>Entrada o salida: Leer y Escribir.</span></li><li><span class="symbol-demo symbol-decision" aria-hidden="true"></span><strong>Rombo</strong><span>Condición: caminos Sí y No.</span></li></ul>
    <p class="lesson-hint"><strong>Detalles clave:</strong> las flechas marcan la dirección. <code>&lt;-</code> (←) asigna un valor; <code>==</code> compara si dos valores son iguales en una condición. <code>Definir</code> indica el tipo de dato. La sangría agrupa instrucciones y <code>//</code> introduce un comentario que no se ejecuta.</p>
    <details class="pseudocode-note">
      <summary>¿Cómo se aplica el pseudocódigo en un lenguaje como Python?</summary>
      <div class="pseudocode-note-body">
        <p><strong>La lógica se conserva.</strong> Las variables, los cálculos, las decisiones y los ciclos sirven de base para programar. Al pasar a un lenguaje concreto, cambia la forma de escribir las instrucciones. El pseudocódigo no tiene una única sintaxis universal; aquí usamos el estilo de PSeInt.</p>
        <p><strong>En Python no escribimos «Definir edad Como Entero».</strong> Python tiene tipado dinámico: los valores tienen un tipo y los nombres de las variables se vinculan a esos valores sin declarar antes un tipo fijo. En <code>edad = 18</code>, el valor es un entero (<code>int</code>).</p>
        <div class="typing-comparison">
          <div><h4>Pseudocódigo</h4><pre><code>Definir edad Como Entero
edad &lt;- 18
Escribir edad</code></pre></div>
          <div><h4>Python</h4><pre><code>edad = 18
print(edad)</code></pre></div>
        </div>
        <p>Una variable puede vincularse después a un valor de otro tipo. Eso no convierte automáticamente los datos: <code>input()</code> devuelve texto; para leer una edad entera usamos <code>edad = int(input("Edad: "))</code>, suponiendo una entrada válida.</p>
        <p><strong>Recuerda:</strong> en Python, <code>=</code> asigna y <code>==</code> compara. Los bloques de <code>if</code>, <code>while</code> y <code>for</code> se delimitan con sangría; no se escribe <code>FinSi</code> ni <code>FinMientras</code>.</p>
      </div>
    </details>
    <p class="note">Primero comprende la entrada, el proceso y la salida. Después revisa la secuencia, las decisiones o los ciclos. Abre cada ejemplo para comparar su código y flujograma.</p>
  </article>`;
  el('grid').innerHTML=intro+ALGORITHM_EXAMPLES.map((example,i)=>`<details class="lesson-example" ${i===0?'open':''}>
    <summary><span class="kicker">Ejemplo ${i+1} · ${escapeHTML(example.structure)}</span><span class="lesson-example-title">${escapeHTML(example.title)}</span><span class="lesson-toggle" aria-hidden="true">⌄</span></summary>
    <div class="lesson-content"><p class="lesson-description">${escapeHTML(example.description)}</p>
    <div class="lesson-columns"><section class="lesson-code" aria-labelledby="code-${example.id}"><h3 id="code-${example.id}">Pseudocódigo</h3><pre class="algorithm"><code>${escapeHTML(example.code)}</code></pre><h4>Fíjate en esto</h4><ul class="lesson-tips">${example.tips.map(tip=>`<li>${escapeHTML(tip)}</li>`).join('')}</ul></section>
    <figure class="lesson-flow"><figcaption>Flujograma · ${escapeHTML(example.structure)}</figcaption><div class="flow-scroll" tabindex="0" role="region" aria-label="Flujograma de ${escapeHTML(example.title)}; desplaza horizontalmente si es necesario">${flowchart(example)}</div></figure></div>
    <div class="lesson-trace"><strong>Prueba de escritorio</strong><p>${escapeHTML(example.trace)}</p></div></div>
  </details>`).join('');
}
const state=ITEMS.map(()=>({selection:null,submitted:false,correct:false}));let active=null;
const el=id=>document.getElementById(id);function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function shuffledOptions(item,i){let opts=[...item.options];let seed=(i+17)*7919;for(let j=opts.length-1;j>0;j--){seed=(seed*16807)%2147483647;let k=seed%(j+1);[opts[j],opts[k]]=[opts[k],opts[j]];}return opts;}
const options=ITEMS.map(shuffledOptions);
function render(){const done=state.filter(s=>s.submitted&&s.correct).length;el('progress').textContent=`${done} de ${ITEMS.length} acertados`;el('bar').style.width=`${done/ITEMS.length*100}%`;
if(active===null){el('tabs').className='category-grid';el('tabs').innerHTML=SECTIONS.map(([id,label],idx)=>{const count=ITEMS.filter(x=>x.sec===id).length;const icons=['🔢','🔐','➗','🧮','⚖️','🧠','🚀','📝'];return `<button class="category-tile" data-tab="${id}"><span class="tile-icon">${icons[idx]}</span><span class="tile-title">${escapeHTML(label)}</span><span class="tile-meta">${id==='pseudocodigo'?ALGORITHM_EXAMPLES.length+' ejemplos guiados':count+' ejercicios'} <span aria-hidden="true">↗</span></span></button>`}).join('');el('sectionHeading').innerHTML='<p class="welcome">Selecciona una categoría para comenzar a practicar.</p>';el('grid').innerHTML='';return;}
el('tabs').className='tabs';el('tabs').innerHTML=`<button class="secondary" data-home="true">← Volver a categorías</button>`;if(active==='pseudocodigo'){renderAlgorithmLesson();return;}const sec=SECTIONS.find(x=>x[0]===active);el('sectionHeading').innerHTML=`<h2 class="section-title">${escapeHTML(sec[1])}</h2><p class="note">Selecciona una alternativa y comprueba tu respuesta.</p>${active==='aritmetica'?'<p class="note"><strong>Precedencia:</strong> paréntesis → potencias → multiplicación, división y módulo → suma y resta. Dentro de los paréntesis se aplica la misma precedencia. Multiplicación, división y módulo se resuelven de izquierda a derecha; suma y resta también. <strong>Potencias:</strong> ** significa elevar a una potencia; las potencias encadenadas se agrupan de derecha a izquierda, salvo que los paréntesis indiquen otro orden.</p>':''}`;
el('grid').innerHTML=ITEMS.map((item,i)=>({item,i})).filter(({item})=>item.sec===active).map(({item,i})=>{const s=state[i], opts=options[i];const label=sec[1];return `<article class="card"><div class="kicker">Desafío ${String(i+1).padStart(2,'0')} · ${escapeHTML(label)}</div>${item.code?`<div class="code-label">Instrucciones del algoritmo</div><pre class="algorithm">${escapeHTML(item.code)}</pre>`:""}${item.context?`<div class="scenario"><strong>Situación:</strong> ${escapeHTML(item.context)}</div>${item.values?`<div class="values">${escapeHTML(item.values)}</div>`:""}`:""}<div class="question">${escapeHTML(item.q)}</div><div class="choices" role="group" aria-label="Alternativas del desafío ${i+1}">${opts.map((opt,j)=>`<button class="choice ${s.selection===opt?'selected':''}" data-select="${i}" data-option="${j}" ${s.submitted?'disabled':''} aria-pressed="${s.selection===opt}"><span class="letter">${String.fromCharCode(65+j)}</span><span>${escapeHTML(opt)}</span></button>`).join('')}</div>${s.submitted?`<div class="feedback ${s.correct?'good':'bad'}" role="status">${s.correct?'✓ ¡Correcto! Has interpretado bien el ejercicio.':'✕ Aún no es correcto. Revisa la solución o vuelve a intentarlo.'}</div><div class="actions">${!s.correct?`<button class="secondary" data-retry="${i}">Intentar de nuevo</button><button class="submit" data-solution="${i}">Ver respuesta explicada</button>`:`<button class="secondary" data-solution="${i}">Ver explicación</button>`}</div>`:`<div class="actions"><button class="submit" data-submit="${i}" ${s.selection===null?'disabled':''}>Comprobar respuesta</button></div>`}</article>`}).join('');}

el('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){active=b.dataset.tab;render();window.scrollTo({top:0,behavior:'smooth'});}else if(e.target.closest('[data-home]')){active=null;render();window.scrollTo({top:0,behavior:'smooth'});}});
el('grid').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;let i;if(b.hasAttribute('data-select')){i=+b.dataset.select;if(!state[i].submitted){state[i].selection=options[i][+b.dataset.option];render();}}else if(b.hasAttribute('data-submit')){i=+b.dataset.submit;state[i].submitted=true;state[i].correct=state[i].selection===ITEMS[i].a;render();}else if(b.hasAttribute('data-retry')){i=+b.dataset.retry;state[i]={selection:null,submitted:false,correct:false};render();}else if(b.hasAttribute('data-solution')){showSolution(+b.dataset.solution);}});
function showSolution(i){const x=ITEMS[i];el('modalTitle').textContent=x.q;el('modalContext').innerHTML=(x.code?`<pre class="algorithm">${escapeHTML(x.code)}</pre>`:'')+(x.context?`<p><strong>Situación:</strong> ${escapeHTML(x.context)}</p>${x.values?`<p><strong>Datos:</strong> ${escapeHTML(x.values)}</p>`:''}`:'');el('answer').textContent='Respuesta: '+x.a;el('explain').innerHTML='<ol>'+(x.steps||[]).map(step=>`<li>${escapeHTML(step)}</li>`).join('')+'</ol>';el('modal').classList.add('show');el('close').focus();}
function closeModal(){el('modal').classList.remove('show');}el('close').addEventListener('click',closeModal);el('modal').addEventListener('click',e=>{if(e.target===el('modal'))closeModal();});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});render();
</script></body></html>
