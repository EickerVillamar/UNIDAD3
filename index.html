if(active===null){el('tabs').className='category-grid';el('tabs').innerHTML=SECTIONS.map(([id,label],idx)=>{const count=ITEMS.filter(x=>x.sec===id).length;const icons=['🔢','🔐','➗','🧮','⚖️','🧠','🚀'];return `<button class="category-tile" data-tab="${id}"><span class="tile-icon">${icons[idx]}</span><span class="tile-title">${escapeHTML(label)}</span><span class="tile-meta">${count} ejercicios <span aria-hidden="true">↗</span></span></button>`}).join('');el('sectionHeading').innerHTML='<p class="welcome">Selecciona una categoría para comenzar a practicar.</p>';el('grid').innerHTML='';return;}
el('tabs').className='tabs';el('tabs').innerHTML=`<button class="secondary" data-home="true">← Volver a categorías</button>`;const sec=SECTIONS.find(x=>x[0]===active);el('sectionHeading').innerHTML=`<h2 class="section-title">${escapeHTML(sec[1])}</h2><p class="note">Selecciona una alternativa y comprueba tu respuesta.</p>${active==='aritmetica'?'<p class="note"><strong>Precedencia:</strong> paréntesis → potencias → multiplicación, división y módulo → suma y resta. Dentro de los paréntesis se aplica la misma precedencia. Multiplicación, división y módulo se resuelven de izquierda a derecha; suma y resta también.</p>':''}`;
el('grid').innerHTML=ITEMS.map((item,i)=>({item,i})).filter(({item})=>item.sec===active).map(({item,i})=>{const s=state[i], opts=options[i];const label=sec[1];return `<article class="card"><div class="kicker">Desafío ${String(i+1).padStart(2,'0')} · ${escapeHTML(label)}</div>${item.code?`<div class="code-label">Instrucciones del algoritmo</div><pre class="algorithm">${escapeHTML(item.code)}</pre>`:""}${item.context?`<div class="scenario"><strong>Situación:</strong> ${escapeHTML(item.context)}</div>${item.values?`<div class="values">${escapeHTML(item.values)}</div>`:""}`:""}<div class="question">${escapeHTML(item.q)}</div><div class="choices" role="group" aria-label="Alternativas del desafío ${i+1}">${opts.map((opt,j)=>`<button class="choice ${s.selection===opt?'selected':''}" data-select="${i}" data-option="${j}" ${s.submitted?'disabled':''} aria-pressed="${s.selection===opt}"><span class="letter">${String.fromCharCode(65+j)}</span><span>${escapeHTML(opt)}</span></button>`).join('')}</div>${s.submitted?`<div class="feedback ${s.correct?'good':'bad'}" role="status">${s.correct?'✓ ¡Correcto! Has interpretado bien el ejercicio.':'✕ Aún no es correcto. Revisa la solución o vuelve a intentarlo.'}</div><div class="actions">${!s.correct?`<button class="secondary" data-retry="${i}">Intentar de nuevo</button><button class="submit" data-solution="${i}">Ver respuesta explicada</button>`:`<button class="secondary" data-solution="${i}">Ver explicación</button>`}</div>`:`<div class="actions"><button class="submit" data-submit="${i}" ${s.selection===null?'disabled':''}>Comprobar respuesta</button></div>`}</article>`}).join('');}

el('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){active=b.dataset.tab;render();window.scrollTo({top:0,behavior:'smooth'});}else if(e.target.closest('[data-home]')){active=null;render();window.scrollTo({top:0,behavior:'smooth'});}});
el('grid').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;let i;if(b.hasAttribute('data-select')){i=+b.dataset.select;if(!state[i].submitted){state[i].selection=options[i][+b.dataset.option];render();}}else if(b.hasAttribute('data-submit')){i=+b.dataset.submit;state[i].submitted=true;state[i].correct=state[i].selection===ITEMS[i].a;render();}else if(b.hasAttribute('data-retry')){i=+b.dataset.retry;state[i]={selection:null,submitted:false,correct:false};render();}else if(b.hasAttribute('data-solution')){showSolution(+b.dataset.solution);}});
function showSolution(i){const x=ITEMS[i];el('modalTitle').textContent=x.q;el('modalContext').innerHTML=(x.code?`<pre class="algorithm">${escapeHTML(x.code)}</pre>`:'')+(x.context?`<p><strong>Situación:</strong> ${escapeHTML(x.context)}</p>${x.values?`<p><strong>Datos:</strong> ${escapeHTML(x.values)}</p>`:''}`:'');el('answer').textContent='Respuesta: '+x.a;el('explain').innerHTML='<ol>'+(x.steps||[]).map(step=>`<li>${escapeHTML(step)}</li>`).join('')+'</ol>';el('modal').classList.add('show');el('close').focus();}
function closeModal(){el('modal').classList.remove('show');}el('close').addEventListener('click',closeModal);el('modal').addEventListener('click',e=>{if(e.target===el('modal'))closeModal();});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});render();
</script></body></html>
